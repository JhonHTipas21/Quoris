name: RAG Evaluation Pipeline

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'evals/golden_dataset.json'

jobs:
  ragas-evaluation:
    runs-on: ubuntu-latest
    env:
      # Thresholds configurables
      MIN_CONTEXT_RECALL: 0.75
      MIN_FAITHFULNESS: 0.80
      MIN_ANSWER_RELEVANCY: 0.75
      # LLM Provider Key for Generation and Judging
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache ChromaDB Embeddings
        id: cache-chroma
        uses: actions/cache@v4
        with:
          path: chroma_db
          # Cache key is based on the hash of all markdown corpus files.
          # If the corpus docs don't change, we reuse the embeddings.
          key: chroma-db-corpus-${{ hashFiles('docs/**/*.md') }}
          restore-keys: |
            chroma-db-corpus-

      - name: Run RAGAS Evaluation Script
        id: run_eval
        run: |
          python evals/run_rag_eval.py

      - name: Post Evaluation Summary to PR
        # This runs even if the previous step failed, so we always report metrics back to the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Read the summary generated by our evaluation script
            let summaryContent = '';
            try {
              summaryContent = fs.readFileSync('evals/eval_summary.md', 'utf8');
            } catch (err) {
              summaryContent = '⚠️ The evaluation script failed to generate the summary report. Check the action logs for fatal errors.';
            }

            const commentBody = summaryContent;

            // Optional: You could search for existing comments from this bot and update them, 
            // but for simplicity we will post a new comment.
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
